{% assign item = site.data.featured[0] %}

{% if item %}
<div class="featured-hero">

  <a href="{{ item.href }}" class="featured-hero-image">
    <img loading="lazy" src="{{ item.thumb }}" alt="{{ item.title }}">
  </a>

    {% if item.caption %}
  <div class="featured-hero-meta">
    <div class="featured-hero-caption">{{ item.caption }}</div>
  </div>
  {% endif %}

</div>
{% endif %}
