<section class="reader-notes">
  {% assign notes = site.data.reader_notes | default: empty %}

  {% if notes == empty %}
    <p class="reader-notes-empty">No reader notes yet.</p>
  {% else %}
    {% for n in notes %}
      <blockquote class="reader-note">
        <p class="reader-note-text">{{ n.quote }}</p>
        <div class="reader-note-meta">
          {% if n.from %}<span class="reader-note-from">— {{ n.from }}</span>{% endif %}
          {% if n.page %}<span class="reader-note-sep">·</span><a class="reader-note-link" href="{{ n.page }}">View page</a>{% endif %}
        </div>
      </blockquote>
    {% endfor %}
  {% endif %}
</section>
