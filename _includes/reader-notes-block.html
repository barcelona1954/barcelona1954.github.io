{% if note.links %}
  <div class="reader-note-links">
    Mentioned:
    {% if note.page %}
      <a href="{{ note.page }}">Eyebrow Comb Over</a>{% if note.links.size > 0 %}, {% endif %}
    {% endif %}

    {% for link in note.links %}
      <a href="{{ link.url }}">{{ link.title }}</a>{% unless forloop.last %}, {% endunless %}
    {% endfor %}
  </div>
{% elsif note.page %}
  <div class="reader-note-links">
    <a href="{{ note.page }}">Referenced Work</a>
  </div>
{% endif %}
