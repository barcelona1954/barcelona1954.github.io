
<nav class="chapter-nav" aria-label="Chapter navigation">

  {% if page.prev_url %}
    <a class="chapter-nav-prev" href="{{ page.prev_url | relative_url }}">
      &larr; {{ page.prev_label | default: "Previous" }}
    </a>
  {% endif %}

  {% if page.next_url %}
    <a class="chapter-nav-next" href="{{ page.next_url | relative_url }}">
      {{ page.next_label | default: "Next" }} &rarr;
    </a>
  {% endif %}

</nav>
