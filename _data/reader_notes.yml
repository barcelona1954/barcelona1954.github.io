- quote: "I had not seen your cartoons until now.  Your cartoons are actually what I remember {my brother} telling me about you years ago.  I laughed out loud several times - it’s a rich collection of humor.  I especially like the Eyebrow Comb Over, Jebediah Steps Out, Boot Camp, Cleaning House, and the Christmas Rapper."
