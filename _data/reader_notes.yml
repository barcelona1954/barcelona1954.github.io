- quote: 'I had not seen your cartoons until now. Your cartoons are actually what I remember {my brother} telling me about you years ago. I laughed out loud several times - it’s a rich collection of humor. I especially like the <a href="/images/cartoons/full/EyebrowCombOverCopyrighted.jpg">Eyebrow Comb Over</a>, <a href="/images/cartoons/full/JebediahStepsOutCopyrighted.jpg">Jebediah Steps Out</a>, <a href="/images/cartoons/full/BootCampCopyrighted.jpg">Boot Camp</a>, <a href="/images/cartoons/full/CleaningHouseCopyrighted.jpg">Cleaning House</a>, and the <a href="/images/cartoons/full/ChristmasRapperCopyrighted.jpg">Christmas Rapper</a>.'
  from: "Reader in Houston"
  